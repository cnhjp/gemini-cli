name: Docs Sync Monitor

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Upstream
        id: check
        run: |
          git remote add upstream https://github.com/google/gemini-cli.git
          git fetch upstream main
          
          # Diff docs/ directory between HEAD and upstream/main
          # We only care if upstream has changed compared to our HEAD state of docs/
          DIFF=$(git diff --name-only HEAD upstream/main -- docs/)
          
          if [ -n "$DIFF" ]; then
            echo "Changes detected in docs/:"
            echo "$DIFF"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            
            # Save diff to file for issue body
            echo "The following files in docs/ have changed in upstream:" > diff_report.txt
            echo "$DIFF" >> diff_report.txt
          else
            echo "No changes in docs/"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Issue
        if: steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Upstream Docs Update Detected"
          content-filepath: diff_report.txt
          labels: documentation, sync-needed
